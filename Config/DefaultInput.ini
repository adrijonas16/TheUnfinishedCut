[/Script/Engine.InputSettings]
; Entrada clásica (Axis/Action Mappings). Se fijan las clases explícitamente porque desde UE 5.1
; el motor usa Enhanced Input por defecto y este proyecto enlaza con BindAxis/BindAction.
DefaultPlayerInputClass=/Script/Engine.PlayerInput
DefaultInputComponentClass=/Script/Engine.InputComponent
bEnableMouseSmoothing=False
bUseMouseForTouch=False

; --- Teclado y ratón ---
+AxisMappings=(AxisName="MoveForward",Scale=1.000000,Key=W)
+AxisMappings=(AxisName="MoveForward",Scale=-1.000000,Key=S)
+AxisMappings=(AxisName="MoveRight",Scale=1.000000,Key=D)
+AxisMappings=(AxisName="MoveRight",Scale=-1.000000,Key=A)
+AxisMappings=(AxisName="Turn",Scale=1.000000,Key=MouseX)
+AxisMappings=(AxisName="LookUp",Scale=-1.000000,Key=MouseY)
+ActionMappings=(ActionName="Interact",Key=E)
+ActionMappings=(ActionName="SwitchCharacter",Key=Tab)
+ActionMappings=(ActionName="ToggleFollow",Key=F)
+ActionMappings=(ActionName="ToggleFollow",Key=Q)
+ActionMappings=(ActionName="RestartPrototype",Key=BackSpace)
+ActionMappings=(ActionName="StartCampaign",Key=Enter)
+ActionMappings=(ActionName="PauseCampaign",Key=P)

; --- Mando (esquema del mockup: R2 interactuar, L1 cambiar, Triángulo orden) ---
+AxisMappings=(AxisName="MoveForward",Scale=1.000000,Key=Gamepad_LeftY)
+AxisMappings=(AxisName="MoveRight",Scale=1.000000,Key=Gamepad_LeftX)
+AxisMappings=(AxisName="TurnRate",Scale=1.000000,Key=Gamepad_RightX)
+AxisMappings=(AxisName="LookUpRate",Scale=-1.000000,Key=Gamepad_RightY)
+ActionMappings=(ActionName="Interact",Key=Gamepad_RightTrigger)
+ActionMappings=(ActionName="Interact",Key=Gamepad_FaceButton_Bottom)
+ActionMappings=(ActionName="SwitchCharacter",Key=Gamepad_LeftShoulder)
+ActionMappings=(ActionName="ToggleFollow",Key=Gamepad_FaceButton_Top)
+ActionMappings=(ActionName="StartCampaign",Key=Gamepad_Special_Right)
+ActionMappings=(ActionName="PauseCampaign",Key=Gamepad_Special_Right)
+ActionMappings=(ActionName="RestartPrototype",Key=Gamepad_Special_Left)
